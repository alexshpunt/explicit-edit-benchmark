---
# yamllint disable rule:line-length
name: Release official workflow

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/official-run.yml
      - .github/workflows/official-submit.yml
      - registries/**
      - scripts/execution-plan.mjs
      - scripts/execution-plan-cli.mjs
      - scripts/model-registry.mjs
      - scripts/normalized-run.mjs
      - scripts/official-result.mjs
      - scripts/official-verifier.mjs
      - scripts/prepare-benchmark.mjs
      - scripts/release-official-workflow.mjs
      - .github/workflows/release-official-workflow.yml

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-official-workflow
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: official-release
    env:
      GH_TOKEN: ${{ secrets.OFFICIAL_RELEASE_TOKEN }}
      OFFICIAL_RELEASE_AUTOMATION: "1"
    steps:
      - name: Require maintainer release credential
        run: test -n "$GH_TOKEN"

      - name: Checkout benchmark
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          token: ${{ secrets.OFFICIAL_RELEASE_TOKEN }}
          path: benchmark

      - name: Checkout caller template
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: alexshpunt/explicit-edit-benchmark-run-template
          token: ${{ secrets.OFFICIAL_RELEASE_TOKEN }}
          path: template

      - name: Checkout production caller
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: alexshpunt/explicit-edit-benchmark-run
          token: ${{ secrets.OFFICIAL_RELEASE_TOKEN }}
          path: caller

      - name: Checkout Pi Agent IDE public repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: alexshpunt/pi-agent-ide
          ref: main
          token: ${{ secrets.OFFICIAL_RELEASE_TOKEN }}
          path: pi-agent-ide-public

      - name: Checkout Pi Agent IDE development repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: alexshpunt/pi-agent-ide-dev
          ref: develop
          token: ${{ secrets.OFFICIAL_RELEASE_TOKEN }}
          path: pi-agent-ide-dev

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: benchmark/package-lock.json

      - name: Install release dependencies
        working-directory: benchmark
        run: npm ci

      - name: Create release branches
        env:
          RELEASE_BRANCH: release/official-${{ github.run_id }}
        run: |
          git config --global user.name github-actions[bot]
          git config --global user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C benchmark switch -c "$RELEASE_BRANCH"
          git -C template switch -c "$RELEASE_BRANCH"
          git -C caller switch -c "$RELEASE_BRANCH"
          git -C pi-agent-ide-public switch -c "$RELEASE_BRANCH"
          git -C pi-agent-ide-dev switch -c "$RELEASE_BRANCH"

      - name: Compute and commit every pin
        working-directory: benchmark
        run: >-
          npm run release:official --
          --template-directory ../template
          --caller-directory ../caller
          --pi-agent-ide-directory ../pi-agent-ide-public
          --pi-agent-ide-directory ../pi-agent-ide-dev

      - name: Push release branches
        env:
          RELEASE_BRANCH: release/official-${{ github.run_id }}
        run: |
          git -C benchmark push --set-upstream origin "$RELEASE_BRANCH"
          git -C template push --set-upstream origin "$RELEASE_BRANCH"
          git -C caller push --set-upstream origin "$RELEASE_BRANCH"
          git -C pi-agent-ide-public push --set-upstream origin "$RELEASE_BRANCH"
          git -C pi-agent-ide-dev push --set-upstream origin "$RELEASE_BRANCH"

      - name: Merge benchmark policy release
        env:
          RELEASE_BRANCH: release/official-${{ github.run_id }}
        run: |
          pr=$(gh pr create --repo alexshpunt/explicit-edit-benchmark --base main --head "$RELEASE_BRANCH" --title "Approve official workflow release" --body "Generated by maintainer release run $GITHUB_RUN_ID.")
          gh pr merge --repo alexshpunt/explicit-edit-benchmark --auto --squash "$pr"
          for attempt in {1..40}; do
            [[ "$(gh pr view --repo alexshpunt/explicit-edit-benchmark "$pr" --json state --jq .state)" = "MERGED" ]] && exit 0
            sleep 15
          done
          echo "Benchmark policy release did not merge within ten minutes" >&2
          exit 1

      - name: Merge caller pin releases
        env:
          RELEASE_BRANCH: release/official-${{ github.run_id }}
        run: |
          for repo in \
            alexshpunt/explicit-edit-benchmark-run-template \
            alexshpunt/explicit-edit-benchmark-run
          do
            pr=$(gh pr create --repo "$repo" --base main --head "$RELEASE_BRANCH" --title "Pin official workflow release" --body "Generated by maintainer release run $GITHUB_RUN_ID after the benchmark policy release merged.")
            gh pr merge --repo "$repo" --squash "$pr"
          done

      - name: Merge Pi Agent IDE pin releases without product CI
        env:
          RELEASE_BRANCH: release/official-${{ github.run_id }}
        run: |
          for target in \
            "alexshpunt/pi-agent-ide:main" \
            "alexshpunt/pi-agent-ide-dev:develop"
          do
            repo="${target%%:*}"
            base="${target##*:}"
            pr=$(gh pr create --repo "$repo" --base "$base" --head "$RELEASE_BRANCH" --title "Pin official benchmark workflow release" --body "Generated by maintainer release run $GITHUB_RUN_ID after the benchmark policy release merged. Product CI is skipped because this changes only immutable benchmark pins.")
            gh pr merge --repo "$repo" --admin --squash "$pr"
          done
