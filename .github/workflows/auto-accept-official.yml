---
name: Auto-accept official observations

"on":
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      candidate:
        description: Optional single Hugging Face candidate number
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: huggingface-dataset-alexshpunt-explicit-edit-benchmark
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout acceptance policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci

      - name: Verify and publish official candidates
        env:
          DATASET_REPOSITORY: alexshpunt/explicit-edit-benchmark
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          CANDIDATE: ${{ inputs.candidate }}
          MAX_CANDIDATES: "4"
        run: |
          set -euo pipefail
          if [[ -n "$CANDIDATE" ]]; then
            node scripts/official-acceptance-cli.mjs accept "$CANDIDATE"
          else
            node scripts/official-acceptance-cli.mjs poll
          fi
