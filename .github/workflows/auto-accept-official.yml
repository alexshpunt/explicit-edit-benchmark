---
name: Auto-accept official observations

"on":
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      candidate:
        description: Optional single Hugging Face candidate number
        required: false
        type: string
      oidc_check_only:
        description: Check a scoped short-lived token without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: huggingface-dataset-alexshpunt-explicit-edit-benchmark
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout acceptance policy
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install pinned dependencies
        run: npm ci

      - name: Confirm OIDC token cannot target another Dataset
        if: inputs.oidc_check_only
        env:
          HF_OIDC_RESOURCE: datasets/alexshpunt/explicit-edit-benchmark-denied
        run: |
          set -euo pipefail
          oidc_response=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fhuggingface.co")
          subject_token=$(jq --exit-status --raw-output \
            .value <<<"$oidc_response")
          request=$(jq --null-input --compact-output \
            --arg token "$subject_token" \
            --arg resource "$HF_OIDC_RESOURCE" \
            '{
              grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
              subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
              subject_token: $token,
              resource: $resource
            }')
          status=$(curl --silent --output "$RUNNER_TEMP/hf-denied.json" \
            --write-out '%{http_code}' \
            --header "Content-Type: application/json" \
            --data "$request" \
            https://huggingface.co/oauth/token)
          test "$status" = "400"
          test "$(jq --raw-output .error "$RUNNER_TEMP/hf-denied.json")" = \
            "invalid_grant"

      - name: Exchange GitHub identity for scoped Hugging Face token
        env:
          HF_OIDC_RESOURCE: datasets/alexshpunt/explicit-edit-benchmark
        run: |
          set -euo pipefail
          oidc_response=$(curl --fail --silent --show-error \
            --header "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https%3A%2F%2Fhuggingface.co")
          subject_token=$(jq --exit-status --raw-output \
            .value <<<"$oidc_response")
          request=$(jq --null-input --compact-output \
            --arg token "$subject_token" \
            --arg resource "$HF_OIDC_RESOURCE" \
            '{
              grant_type: "urn:ietf:params:oauth:grant-type:token-exchange",
              subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
              subject_token: $token,
              resource: $resource
            }')
          response=$(curl --fail-with-body --silent --show-error \
            --header "Content-Type: application/json" \
            --data "$request" \
            https://huggingface.co/oauth/token)
          token=$(jq --exit-status --raw-output .access_token <<<"$response")
          test "$(jq --raw-output .token_type <<<"$response")" = "bearer"
          test "$(jq --raw-output .expires_in <<<"$response")" = "3600"
          echo "::add-mask::$token"
          printf 'HF_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Verify and publish official candidates
        if: ${{ !inputs.oidc_check_only }}
        env:
          DATASET_REPOSITORY: alexshpunt/explicit-edit-benchmark
          CANDIDATE: ${{ inputs.candidate }}
          MAX_CANDIDATES: "4"
        run: |
          set -euo pipefail
          if [[ -n "$CANDIDATE" ]]; then
            node scripts/official-acceptance-cli.mjs accept "$CANDIDATE"
          else
            node scripts/official-acceptance-cli.mjs poll
          fi
