---
name: Accept Hugging Face observation

"on":
  workflow_dispatch:
    inputs:
      dataset_repository:
        description: Hugging Face dataset repository (owner/name)
        required: true
        type: string
      candidate_ref:
        description: Hugging Face pull request number
        required: true
        type: string
      dry_run:
        description: Validate and prepare the append without publishing
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: huggingface-dataset-alexshpunt-explicit-edit-benchmark
  cancel-in-progress: false

jobs:
  accept:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
      - run: npm ci
      - name: Validate, append, and publish the candidate
        id: acceptance
        env:
          CANDIDATE_REF: ${{ inputs.candidate_ref }}
          DATASET_REPOSITORY: ${{ inputs.dataset_repository }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DISCUSSION_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail
          args=(
            npm run benchmark -- accept
            --repository "$DATASET_REPOSITORY"
            --candidate "$CANDIDATE_REF"
          )
          if [[ "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          output="$RUNNER_TEMP/community-acceptance.log"
          "${args[@]}" | tee "$output"
          tail --lines=1 "$output" > "$RUNNER_TEMP/community-acceptance.json"
          jq --exit-status . "$RUNNER_TEMP/community-acceptance.json" > /dev/null

      - name: Notify Explorer about the published Dataset revision
        env:
          EXPLORER_DISPATCH_TOKEN: ${{ secrets.EXPLORER_DISPATCH_TOKEN }}
          EXPLORER_REPOSITORY: alexshpunt/benchmark-explorer
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/community-acceptance.json"
          if [[ "$(jq --raw-output '.changed // false' "$result")" != "true" ]]; then
            echo "Dataset did not change; Explorer notification skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          revision=$(jq --exit-status --raw-output .datasetRevision "$result")
          if [[ -z "$EXPLORER_DISPATCH_TOKEN" ]]; then
            echo "::warning::Dataset $revision was published, but EXPLORER_DISPATCH_TOKEN is not configured."
            echo "Explorer notification skipped for Dataset revision $revision." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          payload=$(jq --compact-output \
            '{event_type:"dataset-updated",client_payload:{datasetRevision:.datasetRevision,addedRuns:.addedRuns}}' \
            "$result")
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $EXPLORER_DISPATCH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            --data "$payload" \
            "https://api.github.com/repos/$EXPLORER_REPOSITORY/dispatches"
          echo "Requested Explorer refresh for Dataset revision $revision." >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize candidate acceptance
        if: always() && steps.acceptance.outcome != 'skipped'
        run: |
          result="$RUNNER_TEMP/community-acceptance.json"
          if [[ ! -s "$result" ]]; then
            echo "## Community acceptance failed before producing a verdict" >> \
              "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          jq --raw-output '
            "## Community acceptance\n" +
            "- run: `" + .runId + "`\n" +
            "- dry run: " + (.dryRun | tostring) + "\n" +
            "- Dataset commit: `" + (.commitOid // "none") + "`\n" +
            "- candidate PR closed with receipt: " +
              ((.candidateClosed // false) | tostring) + "\n" +
            "- files added or updated: " + ((.operationCount // 0) | tostring)
          ' "$result" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$(jq --raw-output .candidateClosed "$result")" = "false" ]]; then
            echo "::warning::Dataset commit succeeded, but the candidate PR could not be closed."
          fi
